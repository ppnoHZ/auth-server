{% extends "base.html" %}

{% block title %}Login - OAuth2 Server{% endblock %}

{% block content %}
<section class="card stack" aria-labelledby="login-title">
    <div class="header">
        <h1 id="login-title">Welcome back</h1>
        <p class="subtext">Sign in to continue to the authorization server and your client management pages.</p>
    </div>
    {% if error %}
    <div class="error" role="alert" aria-live="polite">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login" class="form-grid" novalidate>
        <input type="hidden" name="next" value="{{ next }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus autocomplete="username" autocapitalize="none" spellcheck="false">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit">Sign in</button>
    </form>
    <div class="link-row">
        <span>No account yet?</span>
        <a href="/register">Create one</a>
        <a href="/">Back to dashboard</a>
    </div>
</section>
{% endblock %}
