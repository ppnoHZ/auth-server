<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>{% block title %}OAuth2 Server{% endblock %}</title>
    <style>
        :root {
            --primary: #1d4ed8;
            --primary-hover: #1e40af;
            --accent: #0f766e;
            --bg: #f8fafc;
            --bg-accent: radial-gradient(circle at top left, rgba(29, 78, 216, 0.12), transparent 32%), radial-gradient(circle at top right, rgba(15, 118, 110, 0.1), transparent 28%), linear-gradient(180deg, #f8fafc 0%, #eef4ff 100%);
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border-color: #dbe3f0;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --success: #059669;
            --input-focus: #3b82f6;
            --shadow-lg: 0 24px 60px rgba(15, 23, 42, 0.12);
            --shadow-md: 0 12px 30px rgba(15, 23, 42, 0.08);
            --radius-lg: 24px;
            --radius-md: 14px;
            --radius-sm: 10px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; 
            background: var(--bg-accent);
            min-height: 100vh;
            color: var(--text-main);
            line-height: 1.6;
        }
        a { color: inherit; }
        img { max-width: 100%; display: block; }
        .page-shell {
            min-height: 100vh;
            padding: 32px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .page-shell--top {
            align-items: flex-start;
        }
        .page-main {
            width: 100%;
            max-width: 1120px;
        }
        .card { 
            background: var(--card-bg); 
            padding: 32px; 
            border-radius: var(--radius-lg); 
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(219, 227, 240, 0.9);
            width: 100%; 
            max-width: 560px;
            margin: 0 auto;
        }
        .panel {
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(219, 227, 240, 0.72);
            border-radius: var(--radius-md);
            padding: 18px;
            backdrop-filter: blur(14px);
        }
        .header {
            text-align: center;
            margin-bottom: 28px;
        }
        .header svg {
            width: 52px;
            height: 52px;
            color: var(--primary);
            margin: 0 auto 14px;
            display: block;
            background: linear-gradient(180deg, #eff6ff 0%, #dbeafe 100%);
            padding: 10px;
            border-radius: 18px;
        }
        .eyebrow {
            display: inline-block;
            margin-bottom: 10px;
            padding: 4px 10px;
            border-radius: 999px;
            background: #e0ecff;
            color: var(--primary);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        h1 {
            font-size: clamp(1.55rem, 2vw, 2.1rem);
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.4rem;
            line-height: 1.2;
        }
        .subtext {
            color: var(--text-muted);
            font-size: 0.96rem;
        }
        .stack {
            display: grid;
            gap: 18px;
        }
        .form-grid {
            display: grid;
            gap: 16px;
        }
        .form-grid--two {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .span-full {
            grid-column: 1 / -1;
        }
        .form-group { margin-bottom: 0; }
        label {
            display: block;
            margin-bottom: 0.45rem;
            color: var(--text-main);
            font-size: 0.9rem;
            font-weight: 600;
        }
        .field-hint {
            margin-top: 0.4rem;
            color: var(--text-muted);
            font-size: 0.82rem;
        }
        input[type="text"], input[type="password"], input[type="email"], textarea {
            width: 100%; 
            padding: 0.8rem 0.9rem; 
            border: 1px solid var(--border-color); 
            border-radius: var(--radius-sm); 
            font-size: 0.95rem; 
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: inherit;
            color: var(--text-main);
            background: #fff;
        }
        textarea { min-height: 112px; resize: vertical; }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--input-focus);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.14);
        }
        input::placeholder, textarea::placeholder {
            color: #9ca3af;
        }
        button {
            width: 100%; 
            padding: 0.9rem 1rem; 
            background: linear-gradient(135deg, var(--primary) 0%, #2563eb 100%);
            color: white; 
            border: none; 
            border-radius: var(--radius-sm); 
            font-size: 0.95rem; 
            font-weight: 600; 
            cursor: pointer; 
            transition: transform 0.18s, box-shadow 0.18s, background-color 0.18s;
            box-shadow: 0 12px 24px rgba(37, 99, 235, 0.22);
        }
        button:hover {
            background: linear-gradient(135deg, var(--primary-hover) 0%, #1d4ed8 100%);
            transform: translateY(-1px);
        }
        button:focus-visible,
        a:focus-visible,
        input:focus-visible,
        textarea:focus-visible {
            outline: 3px solid rgba(37, 99, 235, 0.2);
            outline-offset: 2px;
        }
        .button-row {
            display: flex;
            gap: 12px;
        }
        .button-secondary {
            background: #ffffff;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            box-shadow: none;
        }
        .button-secondary:hover {
            background: #f8fafc;
            color: var(--danger);
            border-color: #fecaca;
        }
        .error { 
            color: var(--danger); 
            background: #fef2f2;
            border: 1px solid #fecaca;
            padding: 0.9rem 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.9rem; 
        }
        .success { 
            color: var(--success); 
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            padding: 0.9rem 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.9rem; 
        }
        .link-row {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px 16px;
            margin-top: 22px;
            font-size: 0.92rem;
            color: var(--text-muted);
        }
        .link-row a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        .link-row a:hover { text-decoration: underline; }
        .inline-note {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
        }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        @media (max-width: 720px) {
            .page-shell {
                padding: 20px 14px;
            }
            .card {
                padding: 22px 18px;
                border-radius: 20px;
            }
            .form-grid--two,
            .button-row {
                grid-template-columns: 1fr;
                flex-direction: column;
            }
        }
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    {% block body %}
    <div class="page-shell {% block page_shell_class %}{% endblock %}">
        <main class="page-main" id="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
    {% endblock %}
</body>
</html>
